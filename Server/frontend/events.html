<!doctype html>
<html lang="ru">
<head style="padding: 0;">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">

    <meta charset="utf-8">
    <title>Главная страница</title>
</head>
<body>
    <!-- Верх -->
    <div class="TopBar">
        <div style="margin-left: 10px;" class="Container">
            <div class="Container" style="margin: 20px; align-items: center;">
                <img src="static/images/sirius-logo.svg" width="80px" style="margin-right: 20px;">
                <img src="static/images/aisa-logo.svg" width="80px">
            </div>
            <div class="LineVertical" style="margin-right: 20px;"></div>
            <p class="TitleText" style="align-self: center;">Сириус Афиша - Ассистент</p>
        </div>
    </div>

    <!-- Образцы карточек -->
    <template id="UserMessageCard">
        <div>
            <div class="MessageUser">
                <p style="margin: 5px; overflow-wrap: break-word;" id="text">Сообщение</p>
            </div>
        </div>
    </template>
    <template id="OtherMessageCard">
        <div>
            <div class="MessageOther">
                <p style="margin: 5px; overflow-wrap: break-word;" id="text">Сообщение</p>
            </div>
        </div>
    </template>

    <!-- Панель поиска -->
    <div class="Panel" style="margin: 60px;">
        <p style="margin: 15px 0px 0px 0px">
            Я — ассистент сервиса Афиша-СИРИУС. Спросите, и я найду мероприятия специально для вас.
        </p>

        <div class="Container">
            <div class="Container" style="max-width: 600px; flex: 1; border: solid 2px rgb(136, 208, 196); border-radius: 10px; padding: 10px; margin-right: 20px; margin-top: 20px;">
                <textarea id="messageInput" placeholder="Напишите запрос…" rows="1" maxlength="4000"></textarea>
                <button id="sendButton" disabled>Отправить</button>
            </div>
        </div>
    </div>

    <script scr="static/api.js"></script>
    
</body>
</html>
