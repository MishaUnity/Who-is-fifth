<!doctype html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>Статистика использования</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rubik', sans-serif; background: #f0f4f4; color: #1a1a1a; padding: 32px 40px; }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-title { font-size: 22px; font-weight: 500; color: #1a1a1a; }

        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #6fbfb8;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Rubik', sans-serif;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #5aada6; }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: #fff;
            border: 1.5px solid #a8d8d4;
            border-radius: 14px;
            padding: 20px 24px;
            text-align: center;
        }
        .metric-card .label { font-size: 14px; color: #888; margin-bottom: 10px; }
        .metric-card .value { font-size: 28px; font-weight: 500; color: #1a1a1a; }
        .metric-card .value.green { color: #1D9E75; }

        .full-card {
            background: #fff;
            border: 1.5px solid #a8d8d4;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .full-card .card-title {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .period-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: flex-end;
        }
        .period-btn {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1.5px solid #a8d8d4;
            background: #fff;
            color: #555;
            font-size: 13px;
            font-family: 'Rubik', sans-serif;
            cursor: pointer;
        }
        .period-btn.active {
            background: #6fbfb8;
            color: #fff;
            border-color: #6fbfb8;
            font-weight: 500;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .chart-inner { display: flex; align-items: flex-end; gap: 5px; height: 120px; }
        .chart-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            height: 100%;
        }
        .chart-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
        .chart-bar { width: 100%; border-radius: 3px 3px 0 0; }
        .chart-lbl { font-size: 10px; color: #aaa; white-space: nowrap; }

        .history-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .history-table th {
            text-align: left;
            color: #888;
            font-weight: 400;
            font-size: 13px;
            padding: 0 12px 12px 0;
            border-bottom: 1px solid #eee;
        }
        .history-table td {
            padding: 10px 12px 10px 0;
            border-bottom: 1px solid #f5f5f5;
            color: #1a1a1a;
        }
        .history-table tr:last-child td { border-bottom: none; }

        .error-text { color: #e05555; text-align: center; padding: 20px; font-size: 14px; }
        .loading-text { color: #aaa; text-align: center; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="page-header">
        <h1 class="page-title">Статистика использования</h1>
        <button class="refresh-btn" onclick="loadStats(currentPeriod)">↻ Обновить</button>
    </div>

    <div class="period-row">
        <button class="period-btn active" onclick="setPeriod(7, this)">7 дней</button>
        <button class="period-btn" onclick="setPeriod(14, this)">14 дней</button>
        <button class="period-btn" onclick="setPeriod(30, this)">30 дней</button>
    </div>

    <div class="metrics-row">
        <div class="metric-card">
            <div class="label">Всего токенов</div>
            <div class="value" id="total-tokens">—</div>
        </div>
        <div class="metric-card">
            <div class="label">Запросов</div>
            <div class="value" id="total-requests">—</div>
        </div>
        <div class="metric-card">
            <div class="label">Пользователей</div>
            <div class="value" id="total-users">—</div>
        </div>
    </div>

    <div class="metrics-row">
        <div class="metric-card">
            <div class="label">Токенов сегодня</div>
            <div class="value green" id="today-tokens">—</div>
        </div>
        <div class="metric-card">
            <div class="label">Запросов сегодня</div>
            <div class="value green" id="today-requests">—</div>
        </div>
        <div class="metric-card">
            <div class="label">Новых сессий сегодня</div>
            <div class="value green" id="today-sessions">—</div>
        </div>
    </div>

    <div class="charts-row">
        <div class="full-card" style="margin-bottom: 0;">
            <div class="card-title">Токены по времени</div>
            <div class="chart-inner" id="chart-tok"></div>
        </div>
        <div class="full-card" style="margin-bottom: 0;">
            <div class="card-title">Запросы по времени</div>
            <div class="chart-inner" id="chart-req"></div>
        </div>
    </div>
    <div style="margin-bottom: 16px;"></div>

    <div class="full-card">
        <div class="card-title">История запросов</div>
        <div id="history-content">
            <p class="loading-text">Загрузка...</p>
        </div>
    </div>

    <script>
        // ← поменяй на адрес своего сервера если не localhost
        const API_URL = "http://localhost:8000"
        const TOKEN = localStorage.getItem("token")
        let currentPeriod = 7

        if (!TOKEN) {
            window.location.href = "index.html"
        }

        async function loadStats(days) {
            currentPeriod = days
            document.getElementById("history-content").innerHTML =
                '<p class="loading-text">Загрузка...</p>'

            try {
                const res = await fetch(`${API_URL}/admin/detailed-stats?days=${days}`, {
                    headers: { "Authorization": `Bearer ${TOKEN}` }
                })

                if (res.status === 401) {
                    window.location.href = "index.html"
                    return
                }
                if (res.status === 403) {
                    document.getElementById("history-content").innerHTML =
                        '<p class="error-text">Доступ запрещён — требуются права администратора</p>'
                    return
                }
                if (!res.ok) throw new Error("Ошибка сервера: " + res.status)

                const data = await res.json()
                renderAll(data)

            } catch(e) {
                document.getElementById("history-content").innerHTML =
                    `<p class="error-text">Не удалось загрузить данные: ${e.message}</p>`
            }
        }

        function renderAll(data) {
            document.getElementById("total-tokens").textContent   = data.total_tokens.toLocaleString("ru")
            document.getElementById("total-requests").textContent = data.total_requests.toLocaleString("ru")
            document.getElementById("total-users").textContent    = data.total_users.toLocaleString("ru")
            document.getElementById("today-tokens").textContent   = data.tokens_today.toLocaleString("ru")
            document.getElementById("today-requests").textContent = data.requests_today.toLocaleString("ru")
            document.getElementById("today-sessions").textContent = data.sessions_today.toLocaleString("ru")
            renderChart("chart-tok", data.daily, "tokens_used", "#6fbfb8")
            renderChart("chart-req", data.daily, "requests",    "#1D9E75")
            renderHistory(data.daily)
        }

        function renderChart(containerId, daily, field, color) {
            const el = document.getElementById(containerId)
            const values = daily.map(d => d[field])
            const labels = daily.map(d => {
                const date = new Date(d.period)
                return date.toLocaleDateString("ru", {day:"numeric", month:"short"}).replace(".","")
            })
            const max = Math.max(...values)
            const step = values.length > 10 ? 3 : 1
            el.innerHTML = values.map((v, i) => {
                const pct = Math.round((v / max) * 100)
                const opacity = (0.4 + 0.6 * (pct / 100)).toFixed(2)
                return `<div class="chart-col">
                    <div class="chart-bar-wrap">
                        <div class="chart-bar" style="height:${pct}%;background:${color};opacity:${opacity};"></div>
                    </div>
                    <span class="chart-lbl">${i % step === 0 ? labels[i] : ''}</span>
                </div>`
            }).join("")
        }

        function renderHistory(daily) {
            const el = document.getElementById("history-content")
            if (!daily || daily.length === 0) {
                el.innerHTML = '<p class="loading-text">Нет данных</p>'
                return
            }
            const rows = [...daily].reverse().map(d => {
                const date = new Date(d.period).toLocaleDateString("ru", {
                    day: "numeric", month: "long"
                })
                return `<tr>
                    <td>${date}</td>
                    <td>${d.requests.toLocaleString("ru")}</td>
                    <td>${d.tokens_used.toLocaleString("ru")}</td>
                    <td>${Math.round(d.tokens_used / d.requests).toLocaleString("ru")}</td>
                </tr>`
            }).join("")

            el.innerHTML = `<table class="history-table">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Запросов</th>
                        <th>Токенов</th>
                        <th>Ср. токенов / запрос</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`
        }

        function setPeriod(days, btn) {
            document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"))
            btn.classList.add("active")
            loadStats(days)
        }

        loadStats(7)
    </script>
</body>
</html>
