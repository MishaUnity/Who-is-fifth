<!doctype html>
<html lang="ru">
<head style="padding: 0;">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">

    <meta charset="utf-8">
    <title>Админ Панель</title>
</head>
<body>
    <!-- Верх -->
    <div class="TopBar">
        <div style="margin-left: 10px;" class="Container">
            <div class="Container" style="margin: 20px; align-items: center;">
                <img src="static/images/sirius-logo.svg" width="80px" style="margin-right: 20px;">
                <img src="static/images/aisa-logo.svg" width="80px">
            </div>
            <div class="LineVertical" style="margin-right: 20px;"></div>
            <p class="TitleText" style="align-self: center;">Админ Панель</p>
        </div>
    </div>

    <!-- Админ Панель -->
    <div style="margin: 40px 120px 0 120px;">
        <div style="display: flex; flex-direction: row;">
            <div class="Panel" style="flex: 1; margin-right: 15px;">
                <div class="AccentPanel" style="margin-left: -20px; border-radius: 15px 15px 0px 0px;">
                    <a style="margin-left: 10px; color: white;">Использование</a>
                </div>
                <div style="display: flex; flex-direction: row; margin-top: 10px;">
                    <a style="margin-right: 10px;">Токены:</a>
                    <a id="tokensUsed">000</a>
                </div>
                <div style="display: flex; flex-direction: row; margin-top: 5px;">
                    <a style="margin-right: 10px;">Запросы:</a>
                    <a id="messagesUsed">000</a>
                </div>
                <div style="display: flex; flex-direction: row; margin-top: 5px;">
                    <a style="margin-right: 10px;">Токенов/Запрос:</a>
                    <a id="messageTokensUsed">000</a>
                </div>
            </div>
            <div class="Panel" style="flex: 1; margin-right: 15px;">
                
            </div>
            <div class="Panel" style="flex: 1;">
                
            </div>
        </div>
    </div>

    <script scr="static/api.js"></script>
    <script>
        const tokensUsed = document.querySelector('#tokensUsed');
        const messagesUsed = document.querySelector('#messagesUsed');
        const messageTokensUsed = document.querySelector('#messageTokensUsed');

        function DisplayTokens(data)
        {
            tokensUsed.textContent = data['used_tokens'];
            messagesUsed.textContent = data['used_messanges'];
            messageTokensUsed.textContent = data['used_tokens'] / data['used_messanges'];
        }

        function Refresh(callback)
        {
            fetch('/api/admin/stats', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => callback(data))
            .catch(error => {
                console.error('Ошибка:', error)
            })
        }

        Refresh((responce) => 
        {
            DisplayTokens(responce);
            console.log(responce);
        });
    </script>
    
</body>
</html>
